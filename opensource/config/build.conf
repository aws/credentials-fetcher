# Open Source Build Configuration
# This file contains default configuration for the open source build system

# Core build settings
CF_OUTPUT_DIR=${CF_OUTPUT_DIR:-./dist}
CF_VERSION=${CF_VERSION:-$(git describe --tags --always)}
CF_BUILD_FLAGS=${CF_BUILD_FLAGS:-"-trimpath -buildvcs=0"}

# Installation paths
CF_INSTALL_BIN_DIR=${CF_INSTALL_BIN_DIR:-/usr/sbin}
CF_INSTALL_CONFIG_DIR=${CF_INSTALL_CONFIG_DIR:-/etc}
CF_INSTALL_SYSTEMD_DIR=${CF_INSTALL_SYSTEMD_DIR:-/usr/lib/systemd/system}

# Quality assurance settings
CF_LINT_ENABLED=${CF_LINT_ENABLED:-true}
CF_LINT_CONFIG=${CF_LINT_CONFIG:-.golangci.yml}
CF_SECURITY_ENABLED=${CF_SECURITY_ENABLED:-true}
CF_SECURITY_CONFIG=${CF_SECURITY_CONFIG:-.gosec.json}

# Build modes
CF_ENABLE_DEBUG=${CF_ENABLE_DEBUG:-false}
CF_ENABLE_COVERAGE=${CF_ENABLE_COVERAGE:-false}

# Application-specific paths
CF_KRB_DIR=${CF_KRB_DIR:-/var/credentials-fetcher/krbdir}
CF_UNIX_DOMAIN_SOCKET_DIR=${CF_UNIX_DOMAIN_SOCKET_DIR:-/var/credentials-fetcher/socket}
CF_LOGGING_DIR=${CF_LOGGING_DIR:-/var/credentials-fetcher/logging}