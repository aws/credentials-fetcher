# Open Source Build Configuration
# Single source of truth for all build defaults

# Version (can be overridden by VERSION environment variable)
VERSION=2.0.0

# Build flags for reproducible, optimized binaries
# -trimpath: removes file system paths from binary (for reproducible builds)
# -buildvcs=0: disables VCS info embedding (for reproducible builds)
BUILD_FLAGS=-trimpath -buildvcs=0

# Directory paths (relative to script directory)
BIN_DIR="bin"
BUILD_DIR="build"

# Build modes (0=false, 1=true)
ENABLE_DEBUGGING=0
CODE_COVERAGE=0